---
title: Staff shift log
description: The day's office sign-ins and sign-outs, and anything that needs a look.
noindex: true
---
<section class="intro">
  <div class="wrap">
    <h1 data-reveal>Staff shift log.</h1>
    <p class="lede" data-reveal style="--d:80ms">Who signed in and out at the office, and anything that needs a look.</p>
  </div>
</section>

<section class="section-tight">
  <div class="wrap">
    <div id="sa-auth" class="score-gate" data-reveal>
      <div class="score-gate-inner">
        <form class="score-form" id="sa-auth-form" novalidate>
          <div class="field"><label for="sa-key">Admin key</label><input id="sa-key" type="password" autocomplete="off" required></div>
          <button class="btn btn-primary" type="submit">View log <svg class="ic btn-ic" aria-hidden="true"><use href="/assets/icons.svg#arrow-up-right"/></svg></button>
        </form>
        <p class="notice" id="sa-status" hidden></p>
      </div>
    </div>
    <div id="sa-view" hidden>
      <div class="score-form" style="margin-bottom:1.5rem">
        <div class="field"><label for="sa-date">Date</label><input id="sa-date" type="date"></div>
        <button class="btn btn-ghost" type="button" id="sa-reload">Reload</button>
      </div>
      <div id="sa-out"></div>
    </div>
  </div>
</section>
<script src="/assets/js/staff-admin.js" defer></script>
